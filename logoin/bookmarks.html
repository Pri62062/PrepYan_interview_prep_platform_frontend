<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PrepYan — Bookmarks</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<script src="api.js"></script>
<style>
:root{
  --bg:#EDEAE4; --card:#F5F3EE; --panel:#FDFCF9;
  --border:#D8D4CC; --hover:#E8E5DF; --muted:#D0CBC2;
  --ink1:#1C1917; --ink2:#57534E; --ink3:#A8A29E;
  --accent:#4F46E5; --acdk:#3730A3; --aclt:#EEF2FF; --acring:rgba(79,70,229,.12);
  --green:#059669; --glt:#D1FAE5; --gborder:#6EE7B7;
  --teal:#0D9488;  --tlt:#CCFBF1;
  --amber:#D97706; --alt:#FEF3C7; --aborder:#FCD34D;
  --red:#DC2626;   --rlt:#FEE2E2; --rborder:#FCA5A5;
  --blue:#2563EB;  --blt:#DBEAFE;
  --pink:#DB2777;  --plt:#FCE7F3;
  --mono:'DM Mono',monospace;
  --shadow-sm:0 2px 8px rgba(0,0,0,.05);
  --shadow-md:0 6px 24px rgba(0,0,0,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink1);-webkit-font-smoothing:antialiased}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0}

/* ── TOPBAR ── */
.topbar{background:var(--card);border-bottom:1.5px solid var(--border);height:62px;position:sticky;top:0;z-index:200;box-shadow:var(--shadow-sm)}
.topbar-inner{display:flex;align-items:center;height:100%;padding:0 24px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;margin-right:32px;flex-shrink:0}
.brand-icon{width:32px;height:32px;background:linear-gradient(135deg,#6366F1,#4F46E5);border-radius:9px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(99,102,241,.35)}
.brand-name{font-size:17px;font-weight:700;color:var(--ink1);letter-spacing:-.4px}
.nav-links{display:flex;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-link{font-size:13.5px;color:var(--ink2);padding:0 14px;height:62px;display:flex;align-items:center;border-bottom:2.5px solid transparent;cursor:pointer;transition:color .14s,border-color .14s;white-space:nowrap;text-decoration:none}
.nav-link:hover{color:var(--ink1)}
.nav-link.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.topbar-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
.icon-btn{width:36px;height:36px;border-radius:9px;background:var(--hover);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .14s;position:relative}
.icon-btn:hover{background:var(--muted)}
.icon-btn i{font-size:16px;color:var(--ink2)}
.notif-dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:#EF4444;border:1.5px solid var(--card)}
.role-chip{font-size:11.5px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--aclt);color:var(--accent);border:1px solid rgba(79,70,229,.2)}
.user-btn{display:flex;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--border);border-radius:999px;padding:4px 14px 4px 5px;cursor:pointer;transition:background .14s;text-decoration:none}
.user-btn:hover{background:var(--hover)}
.user-av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#818CF8,#4F46E5);color:white;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.user-name{font-size:13px;font-weight:500;color:var(--ink1)}

/* ── LAYOUT ── */
.page-body{position:relative;z-index:1;padding:32px;max-width:1200px;margin:0 auto}

/* ── PAGE HEADER ── */
.pg-head{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:28px}
.pg-head h1{font-size:clamp(20px,2.5vw,26px);font-weight:700;letter-spacing:-.5px}
.pg-head p{font-size:14px;color:var(--ink2);margin-top:3px}
.bm-count-pill{display:inline-flex;align-items:center;gap:7px;background:var(--aclt);border:1.5px solid rgba(79,70,229,.2);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:600;color:var(--accent)}

/* ── STATS STRIP ── */
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.strip-card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-sm);transition:box-shadow .15s,transform .15s}
.strip-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.strip-icon{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.strip-val{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1}
.strip-lbl{font-size:12px;color:var(--ink3);margin-top:2px}

/* ── FILTER BAR ── */
.filter-bar{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:16px 20px;margin-bottom:24px;box-shadow:var(--shadow-sm)}
.filter-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-wrap i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:15px;pointer-events:none}
.search-inp{width:100%;font-family:'DM Sans',sans-serif;font-size:13.5px;padding:10px 16px 10px 40px;border:1.5px solid var(--border);border-radius:12px;background:var(--panel);color:var(--ink1);outline:none;transition:border-color .15s,box-shadow .15s}
.search-inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--acring);background:#fff}
.search-inp::placeholder{color:var(--ink3)}
.chip{font-size:12.5px;padding:6px 14px;border:1.5px solid var(--border);border-radius:999px;cursor:pointer;color:var(--ink2);background:var(--panel);transition:all .12s;white-space:nowrap;user-select:none}
.chip:hover{background:var(--hover);color:var(--ink1)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500}
.chip.easy{background:var(--glt);color:var(--green);border-color:var(--gborder)}
.chip.med{background:var(--alt);color:var(--amber);border-color:var(--aborder)}
.chip.hard{background:var(--rlt);color:var(--red);border-color:var(--rborder)}
.divider{width:1px;height:28px;background:var(--border);flex-shrink:0}

/* VIEW TOGGLE */
.view-toggle{display:flex;background:var(--hover);border:1.5px solid var(--border);border-radius:10px;padding:3px}
.vt-btn{width:34px;height:30px;border-radius:7px;border:none;cursor:pointer;background:transparent;color:var(--ink3);font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .12s}
.vt-btn.active{background:var(--card);color:var(--accent);box-shadow:var(--shadow-sm)}

/* SORT */
.sort-sel{font-family:'DM Sans',sans-serif;font-size:13px;padding:7px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--panel);color:var(--ink2);outline:none;cursor:pointer}
.btn-danger{font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:500;padding:7px 14px;border:1.5px solid var(--rborder);border-radius:10px;background:var(--rlt);color:var(--red);cursor:pointer;transition:all .12s;white-space:nowrap}
.btn-danger:hover{background:#FEE2E2}

/* ── TOPIC TABS ── */
.topic-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{font-size:12.5px;font-weight:500;padding:6px 16px;border:1.5px solid var(--border);border-radius:999px;cursor:pointer;color:var(--ink2);background:var(--card);transition:all .13s;white-space:nowrap;user-select:none;display:flex;align-items:center;gap:6px}
.tab:hover{border-color:var(--muted);color:var(--ink1)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab-cnt{font-size:11px;font-family:var(--mono);padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.22)}
.tab:not(.active) .tab-cnt{background:var(--hover);color:var(--ink3)}

/* ── TAGS ── */
.tag{font-size:11.5px;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap;display:inline-block}
.t-java{background:var(--aclt);color:var(--accent)}
.t-sql{background:var(--blt);color:var(--blue)}
.t-sys,.t-system-design{background:var(--tlt);color:var(--teal)}
.t-dsa{background:var(--plt);color:var(--pink)}
.t-easy{background:var(--glt);color:var(--green)}
.t-medium,.t-med{background:var(--alt);color:var(--amber)}
.t-hard{background:var(--rlt);color:var(--red)}

/* ── CARD GRID ── */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.bm-card{background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-sm);transition:box-shadow .18s,transform .18s,border-color .18s;position:relative;overflow:hidden}
.bm-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),#818CF8);transform:scaleX(0);transform-origin:left;transition:transform .28s cubic-bezier(.4,0,.2,1)}
.bm-card:hover{box-shadow:var(--shadow-md);transform:translateY(-3px);border-color:var(--muted)}
.bm-card:hover::before{transform:scaleX(1)}
.bm-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.bm-card-title{font-size:14.5px;font-weight:600;color:var(--ink1);line-height:1.45;flex:1}
.bm-bm-icon{font-size:17px;color:var(--accent);cursor:pointer;flex-shrink:0;transition:color .12s,transform .12s}
.bm-bm-icon:hover{color:var(--red);transform:scale(1.15)}
.bm-card-desc{font-size:13px;color:var(--ink2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bm-card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bm-card-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:12px;border-top:1px solid var(--border)}
.status-solved{font-size:12px;color:var(--green);display:flex;align-items:center;gap:5px;font-weight:500}
.status-pending{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:5px}
.attempts-lbl{font-size:11.5px;color:var(--ink3);font-family:var(--mono)}
.card-actions{display:flex;gap:7px}
.btn-attempt{font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:600;padding:7px 16px;border-radius:9px;border:none;cursor:pointer;background:var(--accent);color:white;transition:background .12s;box-shadow:0 2px 8px rgba(79,70,229,.25);display:flex;align-items:center;gap:6px}
.btn-attempt:hover{background:var(--acdk)}
.btn-remove{font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:500;padding:7px 12px;border-radius:9px;border:1.5px solid var(--border);background:var(--panel);color:var(--ink3);cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:5px}
.btn-remove:hover{background:var(--rlt);color:var(--red);border-color:var(--rborder)}

/* ── LIST VIEW ── */
.bm-list{display:flex;flex-direction:column;gap:10px}
.bm-list-item{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:16px 20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow-sm);transition:box-shadow .15s,transform .15s,border-color .15s}
.bm-list-item:hover{box-shadow:var(--shadow-md);transform:translateX(4px);border-color:var(--muted)}
.list-num{font-family:var(--mono);font-size:11px;color:var(--ink3);width:24px;flex-shrink:0;text-align:center}
.list-body{flex:1;min-width:0}
.list-title{font-size:14px;font-weight:600;color:var(--ink1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-meta{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.list-actions{display:flex;gap:7px;flex-shrink:0}

/* ── TABLE VIEW ── */
.q-table-wrap{background:var(--card);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm)}
.q-table{width:100%;border-collapse:collapse}
.q-table thead tr{background:var(--hover)}
.q-table th{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;padding:12px 18px;border-bottom:1.5px solid var(--border);text-align:left;white-space:nowrap}
.q-table td{padding:14px 18px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
.q-table tbody tr:last-child td{border-bottom:none}
.q-table tbody tr:hover{background:rgba(79,70,229,.03)}
.q-title-cell .qt{font-size:13.5px;font-weight:500;color:var(--ink1)}
.q-title-cell .qd{font-size:12px;color:var(--ink3);margin-top:2px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.solved-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--green);background:var(--glt);border:1px solid var(--gborder);border-radius:999px;padding:3px 10px}
.pending-badge{font-size:12px;color:var(--ink3)}
.q-num-cell{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.act-btns{display:flex;gap:7px}
.btn-act{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;padding:6px 12px;border-radius:9px;border:1.5px solid var(--border);cursor:pointer;transition:all .12s;background:var(--panel);color:var(--ink2)}
.btn-act:hover{background:var(--hover)}
.btn-act.primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(79,70,229,.25)}
.btn-act.primary:hover{background:var(--acdk)}
.btn-act.rm{color:var(--red);border-color:var(--rborder);background:var(--rlt)}
.btn-act.rm:hover{background:#FEE2E2}

/* ── MODAL ── */
.modal-content{background:var(--card);border:1.5px solid var(--border);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.modal-header{border-bottom:1.5px solid var(--border);padding:18px 22px}
.modal-title{font-size:16px;font-weight:700;color:var(--ink1);letter-spacing:-.3px}
.modal-body{padding:22px}
.modal-footer{border-top:1.5px solid var(--border);padding:14px 22px;gap:10px}
.form-lbl{font-size:12.5px;font-weight:500;color:var(--ink2);margin-bottom:6px;display:block}
.form-ctrl{width:100%;font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 13px;border:1.5px solid var(--border);border-radius:12px;background:var(--panel);color:var(--ink1);outline:none;transition:border-color .15s,box-shadow .15s}
.form-ctrl:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--acring)}
.form-ctrl::placeholder{color:var(--ink3)}
textarea.form-ctrl{resize:vertical;min-height:130px}
.desc-box{background:var(--panel);border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:14px;color:var(--ink2);line-height:1.7}
.meta-pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;margin-bottom:16px;display:inline-block}
.btn-cancel{font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;padding:10px 20px;border:1.5px solid var(--border);border-radius:11px;background:var(--panel);color:var(--ink2);cursor:pointer;transition:background .12s}
.btn-cancel:hover{background:var(--hover)}
.btn-save{font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;padding:10px 22px;background:var(--accent);color:white;border:none;border-radius:11px;cursor:pointer;box-shadow:0 3px 12px rgba(79,70,229,.3);transition:background .15s}
.btn-save:hover{background:var(--acdk)}
.btn-save:disabled{opacity:.6;cursor:not-allowed}

/* AI FEEDBACK */
.fb-card{border-radius:14px;padding:18px;margin-top:16px;border:1.5px solid}
.fb-card.loading{background:var(--aclt);border-color:rgba(79,70,229,.2);display:flex;align-items:center;gap:12px}
.fb-card.done{background:var(--glt);border-color:var(--gborder)}
.fb-card.error{background:var(--rlt);border-color:var(--rborder)}
.fb-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;margin-bottom:10px}
.fb-card.done .fb-label{color:var(--green)}
.fb-card.error .fb-label{color:var(--red)}
.fb-section{margin-bottom:10px}
.fb-sec-lbl{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.fb-sec-body{font-size:13.5px;color:var(--ink1);line-height:1.7;white-space:pre-line}
.score-pill{font-size:20px;font-weight:700;color:var(--accent);background:var(--aclt);border-radius:10px;padding:4px 14px;font-family:var(--mono)}
.spinner{width:20px;height:20px;border:2.5px solid rgba(79,70,229,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── EMPTY STATE ── */
.empty-wrap{padding:72px 24px;text-align:center}
.empty-icon{width:80px;height:80px;border-radius:22px;background:var(--hover);border:1.5px dashed var(--muted);display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--ink3);margin:0 auto 18px}
.empty-wrap h3{font-size:18px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.empty-wrap p{font-size:14px;color:var(--ink3);line-height:1.7;max-width:320px;margin:0 auto 22px}
.empty-btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;font-size:13.5px;font-weight:600;padding:10px 22px;border-radius:11px;text-decoration:none;border:none;font-family:'DM Sans',sans-serif;cursor:pointer;box-shadow:0 3px 12px rgba(79,70,229,.3);transition:background .14s}
.empty-btn:hover{background:var(--acdk)}

/* SKELETON */
.sk{background:linear-gradient(90deg,var(--hover) 25%,var(--muted) 50%,var(--hover) 75%);background-size:400% 100%;animation:shimmer 1.4s infinite;border-radius:6px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* ANIMATIONS */
.fade-up{animation:fu .35s ease both}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:991px){.page-body{padding:20px}}
@media(max-width:767px){.cards-grid{grid-template-columns:1fr}.stats-strip{grid-template-columns:1fr 1fr}.page-body{padding:16px}}
@media(max-width:575px){.nav-links{display:none}.topbar-inner{padding:0 16px}}
</style>
</head>
<body>

<!-- ── TOPBAR ── -->
<nav class="topbar">
  <div class="topbar-inner">
    <a href="dashboard.html" class="brand">
      <div class="brand-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="brand-name">PrepYan</span>
    </a>
    <div class="nav-links">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="Question.html" class="nav-link">Questions</a>
      <a href="aitutor.html" class="nav-link">AI Tutor</a>
      
      <span class="nav-link active">Bookmarks</span>
      <a href="results.html" class="nav-link">Results</a>
    </div>
    <div class="topbar-right">
      <div class="icon-btn d-none d-md-flex"><i class="bi bi-bell"></i><div class="notif-dot"></div></div>
      <div class="role-chip d-none d-sm-block" id="userRole">User</div>
      <a href="index.html" class="user-btn">
        <div class="user-av" id="userAvatar">U</div>
        <span class="user-name d-none d-md-block" id="userName">User</span>
      </a>
    </div>
  </div>
</nav>

<div class="page-body">

  <!-- Header -->
  <div class="pg-head fade-up">
    <div>
      <h1><i class="bi bi-bookmark-heart-fill me-2" style="color:var(--accent)"></i>Bookmarks</h1>
      <p>Your saved questions — revisit, revise and master them.</p>
    </div>
    <div class="bm-count-pill">
      <i class="bi bi-bookmark-fill"></i>
      <span id="bmCount">0 saved</span>
    </div>
  </div>

  <!-- Stats Strip -->
  <div class="stats-strip fade-up" id="statsStrip">
    <div class="strip-card"><div class="sk" style="height:40px;width:40px;border-radius:11px;flex-shrink:0"></div><div style="flex:1"><div class="sk" style="height:22px;width:44px;margin-bottom:7px"></div><div class="sk" style="height:12px;width:80px"></div></div></div>
    <div class="strip-card"><div class="sk" style="height:40px;width:40px;border-radius:11px;flex-shrink:0"></div><div style="flex:1"><div class="sk" style="height:22px;width:44px;margin-bottom:7px"></div><div class="sk" style="height:12px;width:80px"></div></div></div>
    <div class="strip-card"><div class="sk" style="height:40px;width:40px;border-radius:11px;flex-shrink:0"></div><div style="flex:1"><div class="sk" style="height:22px;width:44px;margin-bottom:7px"></div><div class="sk" style="height:12px;width:80px"></div></div></div>
    <div class="strip-card"><div class="sk" style="height:40px;width:40px;border-radius:11px;flex-shrink:0"></div><div style="flex:1"><div class="sk" style="height:22px;width:44px;margin-bottom:7px"></div><div class="sk" style="height:12px;width:80px"></div></div></div>
  </div>

  <!-- Topic Tabs -->
  <div class="topic-tabs fade-up" id="topicTabs">
    <span class="tab active" data-topic="all" onclick="setTopic(this)">All <span class="tab-cnt" id="tabAllCount">0</span></span>
  </div>

  <!-- Filter Bar -->
  <div class="filter-bar fade-up mb-4">
    <div class="filter-row">
      <div class="search-wrap">
        <i class="bi bi-search"></i>
        <input class="search-inp" id="searchInp" placeholder="Search bookmarked questions…" oninput="applyFilters()"/>
      </div>
      <div class="divider"></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <span class="chip on" data-diff="all"    onclick="setDiff(this)">All Levels</span>
        <span class="chip easy"  data-diff="Easy"   onclick="setDiff(this)">Easy</span>
        <span class="chip med"   data-diff="Medium" onclick="setDiff(this)">Medium</span>
        <span class="chip hard"  data-diff="Hard"   onclick="setDiff(this)">Hard</span>
      </div>
      <div class="divider"></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <span class="chip on" data-status="all"     onclick="setStatus(this)">All Status</span>
        <span class="chip"    data-status="solved"  onclick="setStatus(this)">✓ Solved</span>
        <span class="chip"    data-status="pending" onclick="setStatus(this)">⏳ Pending</span>
      </div>
      <div class="divider"></div>
      <select class="sort-sel" id="sortSel" onchange="applyFilters()">
        <option value="default">Default order</option>
        <option value="alpha">A → Z</option>
        <option value="diff-asc">Easy first</option>
        <option value="diff-desc">Hard first</option>
        <option value="solved">Solved first</option>
        <option value="pending">Pending first</option>
      </select>
      <div class="view-toggle">
        <button class="vt-btn active" id="gridBtn" onclick="setView('grid')" title="Grid"><i class="bi bi-grid-3x3-gap-fill"></i></button>
        <button class="vt-btn"        id="listBtn" onclick="setView('list')" title="List"><i class="bi bi-list-ul"></i></button>
        <button class="vt-btn"        id="tableBtn" onclick="setView('table')" title="Table"><i class="bi bi-table"></i></button>
      </div>
      <button class="btn-danger" onclick="clearAll()"><i class="bi bi-bookmark-x me-1"></i>Clear All</button>
    </div>
  </div>

  <!-- Content Area -->
  <div id="contentArea" class="fade-up"></div>

</div>

<!-- ── ATTEMPT MODAL ── -->
<div class="modal fade" id="attemptModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <div id="mMeta" style="font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px"></div>
          <h5 class="modal-title" id="mTitle">Question</h5>
        </div>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="desc-box" id="mDesc"></div>
        <label class="form-lbl">Your Answer</label>
        <textarea id="mAnswer" class="form-ctrl" placeholder="Type your answer here… Be as detailed as possible."></textarea>
        <div id="mFeedback"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" data-bs-dismiss="modal">Close</button>
        <button id="mSubmit" class="btn-save" onclick="doSubmit()">
          <i class="bi bi-send-fill me-1"></i> Submit Answer
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ═══════════════════════════════════
   CONFIG
═══════════════════════════════════ */
const BASE_URL = "https://interview-prep-7s2n.onrender.com";

/* ═══════════════════════════════════
   STATE
═══════════════════════════════════ */
let allQuestions = [];
let bmQuestions  = [];   // bookmarked + enriched
let displayed    = [];   // after filters
let curTopic  = 'all', curDiff = 'all', curStatus = 'all', curView = 'grid';
let curId     = null;
let modalInst = null;

/* ═══════════════════════════════════
   STORAGE
═══════════════════════════════════ */
function getUserKey(prefix) {
  const u = JSON.parse(localStorage.getItem("user") || "{}");
  return prefix + "_" + (u.email || "guest");
}

const getBookmarks = () =>
  JSON.parse(localStorage.getItem(getUserKey("bookmarks"))) || [];

const saveBookmarks = (b) =>
  localStorage.setItem(getUserKey("bookmarks"), JSON.stringify(b));

const getResults = () =>
  JSON.parse(localStorage.getItem(getUserKey("results"))) || [];

const saveResults = (d) =>
  localStorage.setItem(getUserKey("results"), JSON.stringify(d));

/* ═══════════════════════════════════
   INIT
═══════════════════════════════════ */
window.addEventListener('DOMContentLoaded', async () => {
  modalInst = new bootstrap.Modal(document.getElementById('attemptModal'));
  updateUserUI();
  await loadData();
});

/* ═══════════════════════════════════
   LOAD
═══════════════════════════════════ */
async function loadData() {

  // 🔥 FIX 1: convert to number + remove duplicates
  let bmIds = getBookmarks().map(Number);
  bmIds = [...new Set(bmIds)];

  if (!bmIds.length) {
    renderEmptyStats();
    renderEmpty('no-bookmarks');
    document.getElementById('bmCount').textContent = '0 saved';
    return;
  }

  // show skeleton cards while loading
  showSkeleton();

  try {
    const res = await fetch(`${BASE_URL}/api/questions`, { signal: AbortSignal.timeout(6000) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    allQuestions = await res.json();
  } catch (err) {
    console.warn("Backend unreachable:", err.message);

    // fallback data
    allQuestions = bmIds.map(id => ({
      id: Number(id),
      title: `Question #${id}`,
      topic: 'Unknown',
      difficulty: 'Unknown',
      description: '—',
      answer: ''
    }));
  }

  // 🔥 FIX 2: normalize results IDs
  const results = getResults().map(r => ({
    ...r,
    id: Number(r.id)
  }));

  // 🔥 FIX 3: safe filtering
  bmQuestions = allQuestions
    .filter(q => bmIds.includes(Number(q.id)))
    .map(q => {
      const attempts = results.filter(r => r.id === Number(q.id));

      return {
        ...q,
        diff: q.difficulty,
        desc: q.description || '',
        attempts: attempts.length,
        solved: attempts.some(r => r.correct),
        bm: true
      };
    });

  buildTopicTabs();
  renderStats(bmQuestions);

  document.getElementById('bmCount').textContent =
    `${bmQuestions.length} saved`;

  applyFilters();
}

/* ═══════════════════════════════════
   TOPIC TABS — built from real data
═══════════════════════════════════ */
function buildTopicTabs() {
  const topicMap = {};
  bmQuestions.forEach(q => { topicMap[q.topic] = (topicMap[q.topic]||0)+1; });

  document.getElementById('tabAllCount').textContent = bmQuestions.length;

  const container = document.getElementById('topicTabs');
  // remove old dynamic tabs
  container.querySelectorAll('[data-dynamic]').forEach(el => el.remove());

  Object.entries(topicMap).forEach(([topic, count]) => {
    const s = document.createElement('span');
    s.className = 'tab';
    s.dataset.topic   = topic;
    s.dataset.dynamic = '1';
    s.onclick = () => setTopic(s);
    s.innerHTML = `${esc(topic)} <span class="tab-cnt">${count}</span>`;
    container.appendChild(s);
  });
}

/* ═══════════════════════════════════
   STATS
═══════════════════════════════════ */
function renderStats(data) {
  const total   = data.length;
  const solved  = data.filter(q => q.solved).length;
  const pending = total - solved;
  const easy    = data.filter(q => q.diff === 'Easy').length;

  document.getElementById('statsStrip').innerHTML =
    sc('bi-bookmark-fill',    'var(--aclt)', 'var(--accent)', total,   'Total Saved',  '') +
    sc('bi-patch-check-fill', 'var(--glt)',  'var(--green)',  solved,  'Solved',        'color:var(--green)') +
    sc('bi-hourglass-split',  'var(--alt)',  'var(--amber)',  pending, 'Remaining',     'color:var(--amber)') +
    sc('bi-lightning-charge-fill','var(--blt)','var(--blue)', easy,   'Easy Questions','color:var(--blue)');
}

function renderEmptyStats() {
  const defs = [
    ['bi-bookmark-fill','var(--aclt)','var(--accent)','0','Total Saved',''],
    ['bi-patch-check-fill','var(--glt)','var(--green)','0','Solved','color:var(--green)'],
    ['bi-hourglass-split','var(--alt)','var(--amber)','0','Remaining','color:var(--amber)'],
    ['bi-lightning-charge-fill','var(--blt)','var(--blue)','0','Easy Questions','color:var(--blue)'],
  ];
  document.getElementById('statsStrip').innerHTML = defs.map(d => sc(...d)).join('');
}

function sc(icon, bg, color, val, lbl, valStyle) {
  return `<div class="strip-card">
    <div class="strip-icon" style="background:${bg}"><i class="bi ${icon}" style="color:${color}"></i></div>
    <div><div class="strip-val" style="${valStyle}">${val}</div><div class="strip-lbl">${lbl}</div></div>
  </div>`;
}

/* ═══════════════════════════════════
   FILTERS
═══════════════════════════════════ */
function setTopic(el) {
  document.querySelectorAll('[data-topic]').forEach(t => t.classList.remove('active'));
  el.classList.add('active'); curTopic = el.dataset.topic; applyFilters();
}
function setDiff(el) {
  document.querySelectorAll('[data-diff]').forEach(t => t.classList.remove('on'));
  el.classList.add('on'); curDiff = el.dataset.diff; applyFilters();
}
function setStatus(el) {
  document.querySelectorAll('[data-status]').forEach(t => t.classList.remove('on'));
  el.classList.add('on'); curStatus = el.dataset.status; applyFilters();
}

function applyFilters() {
  const q    = document.getElementById('searchInp').value.toLowerCase();
  const sort = document.getElementById('sortSel').value;
  const diffOrder = {Easy:0, Medium:1, Hard:2, Unknown:3};

  let data = [...bmQuestions];
  if (curTopic  !== 'all') data = data.filter(x => x.topic === curTopic);
  if (curDiff   !== 'all') data = data.filter(x => x.diff  === curDiff);
  if (curStatus !== 'all') data = data.filter(x => curStatus==='solved' ? x.solved : !x.solved);
  if (q)                   data = data.filter(x => x.title.toLowerCase().includes(q) || x.desc.toLowerCase().includes(q));

  data.sort((a,b) => {
    if (sort==='alpha')     return a.title.localeCompare(b.title);
    if (sort==='diff-asc')  return (diffOrder[a.diff]||0)-(diffOrder[b.diff]||0);
    if (sort==='diff-desc') return (diffOrder[b.diff]||0)-(diffOrder[a.diff]||0);
    if (sort==='solved')    return (b.solved?1:0)-(a.solved?1:0);
    if (sort==='pending')   return (a.solved?1:0)-(b.solved?1:0);
    return 0;
  });

  displayed = data;
  renderContent();
}

/* ═══════════════════════════════════
   VIEW TOGGLE
═══════════════════════════════════ */
function setView(v) {
  curView = v;
  ['grid','list','table'].forEach(n => {
    document.getElementById(n+'Btn').classList.toggle('active', n===v);
  });
  renderContent();
}

/* ═══════════════════════════════════
   RENDER CONTENT
═══════════════════════════════════ */
const topicCls = t => ({'Java':'t-java','SQL':'t-sql','DSA':'t-dsa','System Design':'t-sys'}[t]||'t-java');
const diffCls  = d => ({'Easy':'t-easy','Medium':'t-med','Hard':'t-hard'}[d]||'t-med');

function renderContent() {
  const area = document.getElementById('contentArea');
  if (!displayed.length) { area.innerHTML = emptyHtml(bmQuestions.length ? 'no-match' : 'no-bookmarks'); return; }

  if (curView === 'grid')  area.innerHTML = `<div class="cards-grid">${displayed.map(cardHtml).join('')}</div>`;
  if (curView === 'list')  area.innerHTML = `<div class="bm-list">${displayed.map((q,i) => listHtml(q,i+1)).join('')}</div>`;
  if (curView === 'table') area.innerHTML = tableHtml(displayed);
}

/* CARD */
function cardHtml(q) {
  return `<div class="bm-card">
    <div class="bm-card-top">
      <div class="bm-card-title">${esc(q.title)}</div>
      <i class="bi bi-bookmark-fill bm-bm-icon" onclick="removeBookmark(${q.id})" title="Remove bookmark"></i>
    </div>
    <div class="bm-card-desc">${esc(q.desc) || '<em style="color:var(--ink3)">No description</em>'}</div>
    <div class="bm-card-meta">
      <span class="tag ${topicCls(q.topic)}">${esc(q.topic)}</span>
      <span class="tag ${diffCls(q.diff)}">${esc(q.diff)}</span>
      ${q.attempts ? `<span class="attempts-lbl">${q.attempts} attempt${q.attempts>1?'s':''}</span>` : ''}
    </div>
    <div class="bm-card-footer">
      ${q.solved
        ? `<span class="status-solved"><i class="bi bi-check-circle-fill"></i> Solved</span>`
        : `<span class="status-pending"><i class="bi bi-clock"></i> Not attempted</span>`}
      <div class="card-actions">
        <button class="btn-remove" onclick="removeBookmark(${q.id})"><i class="bi bi-bookmark-dash"></i> Remove</button>
        <button class="btn-attempt attempt-btn" data-qid="${q.id}">
          ${q.solved ? '<i class="bi bi-arrow-repeat"></i> Review' : '<i class="bi bi-play-fill"></i> Attempt'}
        </button>
      </div>
    </div>
  </div>`;
}

/* LIST ITEM */
function listHtml(q, i) {
  return `<div class="bm-list-item">
    <span class="list-num">${String(i).padStart(2,'0')}</span>
    <div class="list-body">
      <div class="list-title">${esc(q.title)}</div>
      <div class="list-meta">
        <span class="tag ${topicCls(q.topic)}">${esc(q.topic)}</span>
        <span class="tag ${diffCls(q.diff)}">${esc(q.diff)}</span>
        ${q.solved
          ? `<span style="font-size:12px;color:var(--green);font-weight:500"><i class="bi bi-check-circle-fill me-1"></i>Solved</span>`
          : `<span style="font-size:12px;color:var(--ink3)">Pending</span>`}
        ${q.attempts ? `<span style="font-size:11.5px;color:var(--ink3);font-family:var(--mono)">${q.attempts} attempt${q.attempts>1?'s':''}</span>` : ''}
      </div>
    </div>
    <div class="list-actions">
      <button class="btn-act rm" onclick="removeBookmark(${q.id})"><i class="bi bi-bookmark-dash"></i></button>
      <button class="btn-act primary attempt-btn" data-qid="${q.id}">
        ${q.solved ? '<i class="bi bi-arrow-repeat me-1"></i>Review' : '<i class="bi bi-play-fill me-1"></i>Attempt'}
      </button>
    </div>
  </div>`;
}

/* TABLE */
function tableHtml(data) {
  const rows = data.map((q,i) => `
    <tr>
      <td class="q-num-cell">${String(i+1).padStart(2,'0')}</td>
      <td class="q-title-cell">
        <div class="qt">${esc(q.title)}</div>
        <div class="qd">${esc(q.desc)}</div>
      </td>
      <td><span class="tag ${topicCls(q.topic)}">${esc(q.topic)}</span></td>
      <td><span class="tag ${diffCls(q.diff)}">${esc(q.diff)}</span></td>
      <td>${q.solved
        ? `<span class="solved-badge"><i class="bi bi-check-circle-fill"></i> Solved</span>`
        : `<span class="pending-badge">Pending</span>`}
      </td>
      <td>
        <div class="act-btns">
          <button class="btn-act rm" onclick="removeBookmark(${q.id})"><i class="bi bi-bookmark-dash me-1"></i>Remove</button>
          <button class="btn-act primary attempt-btn" data-qid="${q.id}">
            ${q.solved ? '<i class="bi bi-arrow-repeat me-1"></i>Review' : '<i class="bi bi-play-fill me-1"></i>Attempt'}
          </button>
        </div>
      </td>
    </tr>`).join('');

  return `<div class="q-table-wrap">
    <table class="q-table">
      <thead><tr><th>#</th><th>Question</th><th>Topic</th><th>Difficulty</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

/* Event delegation — catches all attempt buttons regardless of view */
document.getElementById('contentArea').addEventListener('click', e => {
  const btn = e.target.closest('.attempt-btn');
  if (!btn) return;
  openAttempt(parseInt(btn.dataset.qid, 10));
});

/* ═══════════════════════════════════
   SKELETON LOADER
═══════════════════════════════════ */
function showSkeleton() {
  const cards = Array(6).fill(0).map(() => `
    <div class="bm-card">
      <div class="sk" style="height:20px;width:75%;margin-bottom:10px"></div>
      <div class="sk" style="height:13px;width:55%;margin-bottom:4px"></div>
      <div class="sk" style="height:13px;width:40%;margin-bottom:14px"></div>
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <div class="sk" style="height:22px;width:60px;border-radius:999px"></div>
        <div class="sk" style="height:22px;width:50px;border-radius:999px"></div>
      </div>
      <div style="display:flex;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border)">
        <div class="sk" style="height:14px;width:80px"></div>
        <div class="sk" style="height:32px;width:90px;border-radius:9px"></div>
      </div>
    </div>`).join('');
  document.getElementById('contentArea').innerHTML = `<div class="cards-grid">${cards}</div>`;
}

/* ═══════════════════════════════════
   EMPTY STATES
═══════════════════════════════════ */
function emptyHtml(type) {
  if (type === 'no-bookmarks') return `
    <div class="empty-wrap">
      <div class="empty-icon"><i class="bi bi-bookmark-plus"></i></div>
      <h3>No bookmarks yet</h3>
      <p>While browsing questions, click the bookmark icon to save them here for quick access later.</p>
      <a href="questions.html" class="empty-btn"><i class="bi bi-collection me-1"></i> Browse Questions</a>
    </div>`;
  return `
    <div class="empty-wrap">
      <div class="empty-icon"><i class="bi bi-funnel"></i></div>
      <h3>No matches found</h3>
      <p>No bookmarked questions match your current filters. Try clearing the search or adjusting the filters.</p>
      <button class="empty-btn" onclick="resetFilters()"><i class="bi bi-arrow-counterclockwise me-1"></i> Reset Filters</button>
    </div>`;
}

function renderEmpty(type) {
  document.getElementById('contentArea').innerHTML = emptyHtml(type);
}

/* ═══════════════════════════════════
   BOOKMARK ACTIONS
═══════════════════════════════════ */
function removeBookmark(id) {
  saveBookmarks(getBookmarks().filter(x => x !== id));
  bmQuestions = bmQuestions.filter(q => q.id !== id);
  document.getElementById('bmCount').textContent = `${bmQuestions.length} saved`;
  renderStats(bmQuestions);
  buildTopicTabs();
  applyFilters();
  if (!bmQuestions.length) renderEmpty('no-bookmarks');
}

function clearAll() {
  if (!confirm('Remove all bookmarks? You can re-bookmark questions anytime.')) return;
  saveBookmarks([]);
  bmQuestions = []; displayed = [];
  document.getElementById('bmCount').textContent = '0 saved';
  renderEmptyStats();
  buildTopicTabs();
  renderEmpty('no-bookmarks');
}

function resetFilters() {
  document.getElementById('searchInp').value = '';
  curTopic = 'all'; curDiff = 'all'; curStatus = 'all';
  document.querySelectorAll('[data-topic]').forEach(t => t.classList.toggle('active', t.dataset.topic==='all'));
  document.querySelectorAll('[data-diff]').forEach(t => t.classList.toggle('on', t.dataset.diff==='all'));
  document.querySelectorAll('[data-status]').forEach(t => t.classList.toggle('on', t.dataset.status==='all'));
  applyFilters();
}

/* ═══════════════════════════════════
   ATTEMPT MODAL
═══════════════════════════════════ */
function openAttempt(id) {
  const q = bmQuestions.find(x => x.id === id);
  if (!q) return;
  curId = id;

  document.getElementById('mMeta').textContent     = `${q.topic} · ${q.diff}`;
  document.getElementById('mTitle').textContent    = q.title;
  document.getElementById('mDesc').textContent     = q.desc || 'No description available.';
  document.getElementById('mAnswer').value         = '';
  document.getElementById('mFeedback').innerHTML   = '';

  const btn = document.getElementById('mSubmit');
  btn.disabled  = false;
  btn.innerHTML = '<i class="bi bi-send-fill me-1"></i> Submit Answer';

  modalInst.show();
}

async function doSubmit() {
  const answer = document.getElementById('mAnswer').value.trim();

  if (!answer) {
    const ta = document.getElementById('mAnswer');
    ta.style.borderColor = 'var(--red)';
    ta.focus();
    setTimeout(() => ta.style.borderColor = '', 1500);
    return;
  }

  const q    = bmQuestions.find(x => x.id === curId);
  const btn  = document.getElementById('mSubmit');
  const fbEl = document.getElementById('mFeedback');

  if (!q) {
    fbEl.innerHTML = "⚠ Question not found. Reload page.";
    return;
  }

  // 🔒 disable button
  btn.disabled  = true;
  btn.innerHTML = 'Evaluating...';

  // 🔄 loading UI
  fbEl.innerHTML = `
    <div class="fb-card loading">
      <div class="spinner"></div>
      <div style="font-size:14px;color:var(--accent)">
        AI is evaluating your answer...
      </div>
    </div>`;

  try {
    // 🔥 TIMEOUT FIX (Render sleep issue)
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 15000);

    const res = await fetch(`${BASE_URL}/api/ai/ask`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question: q.title,
        description: q.desc,
        answer: answer
      }),
      signal: controller.signal
    });

    clearTimeout(timeout);

    if (!res.ok) {
      throw new Error(`AI error ${res.status}`);
    }

    const aiText = await res.text();

    if (!aiText || !aiText.trim()) {
      throw new Error("Empty AI response");
    }

    // ✅ verdict logic
    const txt = aiText.toLowerCase();
    const isCorr =
      txt.includes("correct") &&
      !txt.includes("incorrect") &&
      !txt.includes("partially");

    // 💾 save result
    const results = getResults();
    results.push({
      id: q.id,
      correct: isCorr,
      timestamp: Date.now()
    });
    saveResults(results);

    // 📊 update UI state
    const bq = bmQuestions.find(x => x.id === q.id);
    if (bq) {
      bq.attempts++;
      bq.solved = bq.solved || isCorr;
    }

    renderStats(bmQuestions);

    // 🎯 show feedback
    fbEl.innerHTML = buildFeedback(aiText);

    btn.innerHTML = '<i class="bi bi-arrow-repeat me-1"></i> Try Again';

  } catch (err) {
    console.error("AI ERROR:", err);

    if (err.name === "AbortError") {
      fbEl.innerHTML = `
        <div class="fb-card error">
          <div class="fb-label">⏳ Server Slow</div>
          <div>Backend is waking up. Try again.</div>
        </div>`;
    } else if (
      err.message.includes("429") ||
      err.message.toLowerCase().includes("rate")
    ) {
      fbEl.innerHTML = `
        <div class="fb-card error">
          <div class="fb-label">⚠ Rate Limit</div>
          <div>Please wait 10 seconds and try again.</div>
        </div>`;
    } else {
      fbEl.innerHTML = `
        <div class="fb-card error">
          <div class="fb-label">⚠ AI Failed</div>
          <div>${esc(err.message)}</div>
        </div>`;
    }

    btn.innerHTML = '<i class="bi bi-send-fill me-1"></i> Retry';
  }

  // 🔓 enable button again
  btn.disabled = false;
}
 
   
  

function extract(text, label) {
  const m = text.match(new RegExp(`${label}:\\s*(.+?)(?=\\n[A-Z ]+:|$)`, 'is'));
  return m ? m[1].trim() : null;
}

function buildFeedback(text) {
  const score   = extract(text, 'SCORE')       || '—';
  const verdict = extract(text, 'VERDICT')     || 'Evaluated';
  const fb      = extract(text, 'FEEDBACK')    || text;
  const best    = extract(text, 'BEST ANSWER') || '';

  const vLower = verdict.toLowerCase();

  const vColor =
    vLower.includes('partially') ? 'var(--amber)' :
    vLower.includes('incorrect') ? 'var(--red)' :
    'var(--green)';

  // 🔥 IMPORTANT: dynamic card color
  const cardClass =
    vColor === 'var(--green)' ? 'done' :
    vColor === 'var(--amber)' ? 'loading' :
    'error';

  return `
    <div class="fb-card ${cardClass}">
      <div class="fb-label">✦ AI Evaluation</div>

      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <span class="score-pill">${esc(score)}</span>
        <span style="font-size:13px;font-weight:600;color:${vColor}">
          ${esc(verdict)}
        </span>
      </div>

      ${fb ? `
        <div class="fb-section">
          <div class="fb-sec-lbl">Feedback</div>
          <div class="fb-sec-body">${esc(fb)}</div>
        </div>
      ` : ''}

      ${best ? `
        <div class="fb-section" style="background:rgba(5,150,105,.07);border-radius:10px;padding:12px;margin-top:8px">
          <div class="fb-sec-lbl">Model Answer</div>
          <div class="fb-sec-body">${esc(best)}</div>
        </div>
      ` : ''}

    </div>
  `;
}

/* ═══════════════════════════════════
   HELPERS
═══════════════════════════════════ */
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateUserUI() {
  try {
    const u = JSON.parse(localStorage.getItem("user"));
    if (!u) return;

    // 🔥 Better fallback order
    const displayName =
      u.name ||
      u.username ||
      (u.email ? u.email.split("@")[0] : null) ||
      "User";

    // ✅ Set UI safely
    const nameEl = document.getElementById('userName');
    const roleEl = document.getElementById('userRole');
    const avatarEl = document.getElementById('userAvatar');

    if (nameEl) nameEl.textContent = displayName;
    if (roleEl) roleEl.textContent = (u.role || "USER").toUpperCase();

    // 👤 Avatar initials
    if (avatarEl) {
      const initials = displayName
        .split(" ")
        .map(w => w[0])
        .join("")
        .toUpperCase()
        .slice(0, 2);

      avatarEl.textContent = initials;
    }

  } catch (e) {
    console.warn("updateUserUI error:", e);
  }
}
